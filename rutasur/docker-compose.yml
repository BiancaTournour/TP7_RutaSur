# RutaSur - todo el entorno con UN solo comando:   docker compose up --build
name: rutasur

x-backend: &backend
  build: ./backend
  image: rutasur-backend:latest
  restart: unless-stopped
  environment: &backend-env
    KAFKA_BROKERS: kafka:9092
    MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
    MONGO_DB: rutasur
    ACELERACION: ${ACELERACION:-120}
    SEMILLA: ${SEMILLA:-rutasur-2026}
    ENVIOS_POR_MINUTO: ${ENVIOS_POR_MINUTO:-20}
    PROB_DEMORA_HUB: ${PROB_DEMORA_HUB:-0.1}
    TASA_DUPLICADO: ${TASA_DUPLICADO:-0.02}
    TASA_FUERA_DE_ORDEN: ${TASA_FUERA_DE_ORDEN:-0.02}
    TASA_MALFORMADO: ${TASA_MALFORMADO:-0.01}
    FACTOR_TARDE: ${FACTOR_TARDE:-1.25}
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_healthy

services:
  # ---------- infraestructura ----------
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "29092:29092" # acceso desde el host (herramientas locales)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # modo KRaft: un solo contenedor, sin ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # los 6 topics los crea kafka-init con su retencion
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  mongo:
    image: mongo:7
    # replica set de UN nodo: necesario para change streams y transacciones
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }) }; if (!db.hello().isWritablePrimary) quit(1)"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka-init:
    <<: *backend
    restart: "no"
    command: ["node", "src/tools/init-topics.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: kafka-init
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- servicios (cada uno es un proceso Node.js separado) ----------
  simulador:
    <<: *backend
    command: ["node", "src/simulator/index.js"]
    ports:
      - "4000:4000"
    environment:
      <<: *backend-env
      SERVICE_NAME: simulador

  proyector:
    <<: *backend
    command: ["node", "src/proyector/index.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: proyector

  notificaciones:
    <<: *backend
    command: ["node", "src/notificaciones/index.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: notificaciones

  reprogramacion:
    <<: *backend
    command: ["node", "src/reprogramacion/index.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: reprogramacion

  monitor-sla:
    <<: *backend
    command: ["node", "src/monitor-sla/index.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: monitor-sla

  analitica:
    <<: *backend
    command: ["node", "src/analitica/index.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: analitica

  # Cuarto indicador: NO arranca solo. Se activa en la demo (paso 8):
  #   docker compose --profile replay up -d analitica-tiempo-hub
  analitica-tiempo-hub:
    <<: *backend
    profiles: ["replay"]
    command: ["node", "src/analitica-tiempo-hub/index.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: analitica-tiempo-hub

  # Herramientas de operacion (lag, DLQ, reconstruccion, recuento):
  #   docker compose run --rm tools src/tools/lag.js
  tools:
    <<: *backend
    profiles: ["tools"]
    restart: "no"
    entrypoint: ["node"]
    command: ["src/tools/lag.js"]
    environment:
      <<: *backend-env
      SERVICE_NAME: tools

# ---------- interfaz ----------
  web:
    build: ./web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      MONGO_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0
      MONGODB_URI: mongodb://mongo:27017/rutasur?replicaSet=rs0  
      MONGO_DB: rutasur
      SIMULADOR_URL: http://simulador:4000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  kafka-data:
  mongo-data:
